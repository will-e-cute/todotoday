<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo Cute Wilfried</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="app-title">ToDo-Cute Wilfried</h1>
                <div class="header-controls">
                    <div class="view-controls">
                        <button id="weekViewBtn" class="btn btn--sm btn--primary view-btn active">Semaine</button>
                        <button id="monthViewBtn" class="btn btn--sm btn--outline view-btn">Mois</button>
                    </div>
                    <div class="weekend-toggle">
                        <label class="toggle-switch">
                            <input type="checkbox" id="weekendToggle">
                            <span class="toggle-slider"></span>
                        </label>
                        <span class="toggle-label">Afficher les week-ends</span>
                    </div>
                    <div class="action-controls">
                        <button id="addTaskBtn" class="btn btn--primary">+ Ajouter une Tâche</button>
                        <div class="dropdown">
                            <button id="exportImportBtn" class="btn btn--outline">Export/Import ▼</button>
                            <div class="dropdown-content">
                                <button id="exportBtn">Exporter XML</button>
                                <button id="importBtn">Importer XML</button>
                                <input type="file" id="importFile" accept=".xml" hidden>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Dashboard -->
        <main class="dashboard">
            <div class="dashboard-header">
                <div class="date-navigation">
                    <button id="prevBtn" class="btn btn--outline nav-btn">‹</button>
                    <h2 id="currentPeriod" class="period-title">16-20 septembre 2025</h2>
                    <button id="nextBtn" class="btn btn--outline nav-btn">›</button>
                    <button id="todayBtn" class="btn btn--secondary">Aujourd'hui</button>
                </div>
            </div>

            <!-- Calendar Grid -->
            <div class="calendar-container">
                <div id="calendarGrid" class="calendar-grid">
                    <!-- Calendar days will be generated here -->
                </div>
            </div>
        </main>

        <!-- Task Creation Modal -->
        <div id="taskModal" class="modal hidden">
            <div class="modal-backdrop" id="modalBackdrop"></div>
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3 id="modalTitle">Ajouter une Nouvelle Tâche</h3>
                        <button id="closeModal" class="modal-close">×</button>
                    </div>
                    <form id="taskForm" class="modal-body">
                        <div class="form-group">
                            <label class="form-label" for="taskTitle">Titre de la Tâche *</label>
                            <input type="text" id="taskTitle" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="taskComment">Description/Commentaire</label>
                            <textarea id="taskComment" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="form-group">
                            <label class="form-label">Niveau de Priorité *</label>
                            <div class="priority-selection">
                                <label class="priority-option">
                                    <input type="radio" name="taskPriority" value="critical" class="priority-radio">
                                    <span class="priority-label priority-critical">Critique</span>
                                </label>
                                <label class="priority-option">
                                    <input type="radio" name="taskPriority" value="high" class="priority-radio">
                                    <span class="priority-label priority-high">Haute</span>
                                </label>
                                <label class="priority-option">
                                    <input type="radio" name="taskPriority" value="medium" class="priority-radio" checked>
                                    <span class="priority-label priority-medium">Moyenne</span>
                                </label>
                                <label class="priority-option">
                                    <input type="radio" name="taskPriority" value="low" class="priority-radio">
                                    <span class="priority-label priority-low">Faible</span>
                                </label>
                            </div>
                        </div>
                        <div class="form-group">
                            <label class="form-label" for="taskDueDate">Date *</label>
                            <input type="date" id="taskDueDate" class="form-control" required>
                        </div>
                        <div class="form-group">
                            <label class="checkbox-container">
                                <input type="checkbox" id="taskRecurring" name="recurring">
                                <span class="checkmark"></span>
                                Tâche récurrente
                            </label>
                        </div>
                        <div class="form-group recurring-options" id="recurringOptions" style="display: none;">
                            <label class="form-label" for="taskFrequency">Fréquence de répétition:</label>
                            <select id="taskFrequency" class="form-control">
                                <option value="daily">Quotidien</option>
                                <option value="weekly">Hebdomadaire</option>
                                <option value="monthly">Mensuel</option>
                            </select>
                        </div>
                    </form>
                    <div class="modal-footer">
                        <button id="cancelTask" class="btn btn--outline">Annuler</button>
                        <button id="saveTask" class="btn btn--primary">Enregistrer la Tâche</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Task Detail Modal -->
        <div id="taskDetailModal" class="modal hidden">
            <div class="modal-backdrop" id="detailModalBackdrop"></div>
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h3>Détails de la Tâche</h3>
                        <button id="closeDetailModal" class="modal-close">×</button>
                    </div>
                    <div class="modal-body">
                        <div id="taskDetailContent">
                            <!-- Task details will be populated here -->
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button id="deleteTaskBtn" class="btn btn--outline delete-btn">Supprimer</button>
                        <button id="editTaskBtn" class="btn btn--outline">Modifier</button>
                        <button id="toggleCompleteBtn" class="btn btn--primary">Marquer Terminé</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Statistics Panel -->
        <aside class="stats-panel">
            <h3>Aperçu des Tâches</h3>
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-value" id="totalTasks">0</span>
                    <span class="stat-label">Total</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="completedTasks">0</span>
                    <span class="stat-label">Terminées</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="pendingTasks">0</span>
                    <span class="stat-label">En cours</span>
                </div>
                <div class="stat-item">
                    <span class="stat-value" id="criticalTasks">0</span>
                    <span class="stat-label">Critiques</span>
                </div>
            </div>
        </aside>
    </div>

    <script src="app.js"></script>
</body>
</html>
